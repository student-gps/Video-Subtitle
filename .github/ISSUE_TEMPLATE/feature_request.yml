name: Feature request
description: Suggest an improvement to the subtitle-processing workflow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private media, API keys, or private subtitle text. Describe the use case with synthetic examples.
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow gap
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Privacy, compatibility, or implementation impact
      description: Explain whether this affects local processing, external LLM calls, output formats, or existing workflows.
